plugins {
    id 'com.android.application'
}

android {
    namespace 'com.moonlit.monarch'
    compileSdk 35

    defaultConfig {
        applicationId 'com.moonlit.monarch'
        minSdk 23
        targetSdk 35
        versionCode 19
        versionName '5.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}
