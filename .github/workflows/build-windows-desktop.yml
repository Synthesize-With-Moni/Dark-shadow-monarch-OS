name: Build Shadow System Windows Desktop

on:
  push:
    branches:
      - main
      - master
      - codex/**
    paths:
      - "desktop/**"
      - "app/src/main/assets/**"
      - "app/src/main/res/drawable/monarch_icon.png"
      - "tools/self_test.js"
      - "tools/test_storage_recovery.js"
      - "tools/desktop_frontend_test.js"
      - "tools/test_custom_quest_rewards.js"
      - ".github/workflows/build-windows-desktop.yml"
  pull_request:
    branches:
      - main
      - master
    paths:
      - "desktop/**"
      - "app/src/main/assets/**"
      - "app/src/main/res/drawable/monarch_icon.png"
      - "tools/self_test.js"
      - "tools/test_storage_recovery.js"
      - "tools/desktop_frontend_test.js"
      - "tools/test_custom_quest_rewards.js"
      - ".github/workflows/build-windows-desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Set up Rust 1.90.0
        uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install locked desktop dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Assemble Windows-only frontend from Change 19
        working-directory: desktop
        run: pnpm run desktop:prepare

      - name: Generate Windows app icons
        working-directory: desktop
        run: pnpm run desktop:icons

      - name: Run Change 19 system self-test
        run: node tools/self_test.js

      - name: Verify save recovery behavior
        run: node tools/test_storage_recovery.js

      - name: Verify Windows dashboard wiring
        run: node tools/desktop_frontend_test.js

      - name: Verify custom quest reward reversal
        run: node tools/test_custom_quest_rewards.js

      - name: Build NSIS installer
        working-directory: desktop
        run: pnpm run desktop:build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ShadowSystem-Windows-Installer
          path: desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
